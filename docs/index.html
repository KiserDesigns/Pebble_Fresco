<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresco Settings</title>

  <style>
    html,
body {
  background-color: lightblue;
  height: 100vh; /* Use vh as a fallback for browsers that do not support Custom Properties */
  height: calc(var(--vh, 1vh) * 100);
  margin: 0;
  padding: 0;
}

canvas {
  
    image-rendering: optimizeSpeed;             /* Older versions of FF          */
    image-rendering: -moz-crisp-edges;          /* FF 6.0+                       */
    image-rendering: -webkit-optimize-contrast; /* Safari                        */
    image-rendering: -o-crisp-edges;            /* OS X & Windows Opera (12.02+) */
    image-rendering: pixelated;                 /* Awesome future-browsers       */
    -ms-interpolation-mode: nearest-neighbor;   /* IE                            */
}

*:not(body, html) {
  border: solid 0px red;
  box-sizing: border-box;
}

.center {
  align-items: center;
  justify-content: center;
}
.pad {
  padding: 1vh;
}
.grow {
  flex-grow: 1;
}
.flex {
  display: flex;
}
.scroller {
  min-height: 0;
  overflow-y: auto;
}
.layer {
  height: 60px;
  margin: 1vh;
  background-color: rgb(124, 180, 199);
}
.square {
  aspect-ratio:1/2;
  height:100%;
}
.action {
  height:80%;
  aspect-ratio:1/1;
  background-color: white;
  cursor:pointer;
}
.handle {
  height:80%;
  aspect-ratio:1/2;
  background-color: white;
  cursor: grab;
}
.ghost-class {
  background-color: darkslategrey;
}

  </style>

  
</head>
<body>
  <div style="display:flex;flex-direction:column;height:100%;max-height:100%;margin:0;">
  <div class="flex">
    <div class="center pad">
      <input id='submit_button' type='button' value='Save'>
    </div>
    <div class="center pad grow flex">
      Platform:&nbsp
      <select id="platform">
        <option value="aplite">Classic Pebble</option>
        <option value="basalt">Pebble Time</option>
        <option value="chalk">Time Round</option>
        <option value="diorite">Pebble 2</option>
        <option value="emery" selected>Pebble Time 2</option>
        <option value="flint">Pebble 2 Duo</option>
        <option value="gabbro">Pebble Round 2</option>
      </select>
    </div>
    <div class="center pad">
      <input id='exit_button' type='button' value='Exit'>
    </div>
  </div>
  <div class="flex">
    <div class="pad" style="background-color:#808080;">
      <div id="canvas_container" style="position: relative;">
        <canvas id="preview" style="position: absolute; top: 0; left: 0;"></canvas>
        <canvas id="mask" style="position: absolute; top: 0; left: 0;"></canvas>
      </div>
    </div>
    <div class="grow scroller" id="layer_container"></div>
  </div>
  <div class="pad">
    Background Color:<input id='background_color_input' type='color' value='#000000'>
    <!-- Temp in F:<input id='temperature_checkbox' type='checkbox'> -->
    Spoof Date/Time:<input type="datetime-local" id="datetime">
    <br>Battery %:<input type="number" id="battery" value="80">
    Step Count:<input type="number" id="steps" value="4600">
    <br>Heartrate:<input type="number" id="heartrate" value="75">
    24-Hour Mode:<select id ="time_mode">
    <option value="24" selected>24</option>
    <option value="12">12</option></select>
  </div>
  <div id="layer_info" class="scroller"></div>
</div>
<script src="./Sortable.min.js"></script>
<script src="./strftime.min.js"></script>
<script src="./layerClass.js"></script>


  <script>
    // Get a handle to the button's HTML element
const submitButton = document.getElementById("submit_button");
const platform_element = document.getElementById("platform");
const preview = document.getElementById("preview");
const ctx = preview.getContext("2d");
const mask = document.getElementById("mask");
const mask_ctx = mask.getContext("2d");
const canvas_container = document.getElementById("canvas_container");
const layer_container = document.getElementById("layer_container");
const layer_info = document.getElementById("layer_info");

const background_color = document.getElementById("background_color_input");

background_color.addEventListener("input", function () {
  this.value = quantizeColor(this.value);
  drawLayers();
})

document.getElementById("datetime").value = (new Date).strftime("%Y-%m-%dT%H:%M");

const numLayers = 25;

const layers = [];

var platform;
var plat_w;
var plat_h;
//init. May need to guard this until page/js completely loaded
getPlatform();
defaultLayers();
//loadLayersFromLocalStorage();
populateList();
drawLayers();

function openLayer(i) {
  if (i<0){ layer_info.innerHTML='';return; }
  layer_info.innerHTML = `Name: <input type="text" value="${layers[i].getName()}"
  onchange="layers[${i}].setName(this.value);document.getElementById('name${i}').innerHTML=this.value;"></input>
  <br>
  Layer Type: <select
  onchange="layers[${i}].setType(this.value);drawLayers();openLayer(${i})">
    <option value="rect" ${layers[i].getType()=='rect'?'selected':''}>&#9633; / &#9675;</option>
    <option value="text" ${layers[i].getType()=='text'?'selected':''}>&#127280;&#127281;&#127282;</option></select>
  Inverter?: <select
  onchange="setLayerSetting(${i}, 'inverter', this.value);drawLayers();">
    <option value="true" ${layers[i].getLayerSetting('inverter')=='true'?'selected':''}>Yes</option>
    <option value="false" ${layers[i].getLayerSetting('inverter')=='true'?'':'selected'}>No</option></select>
  <br>
  (X, Y): (<input type="number" value="${layers[i].getPos()["x"]}"
  onchange="layers[${i}].setX(this.value);drawLayers();"></input>
  ,<input type="number" value="${layers[i].getPos()["y"]}"
  onchange="layers[${i}].setY(this.value);drawLayers();"></input>)
  <br>
  (W, H): (<input type="number" value="${layers[i].getPos()["w"]}"
  onchange="layers[${i}].setW(this.value);drawLayers();"></input>
  ,<input type="number" value="${layers[i].getPos()["h"]}"
  onchange="layers[${i}].setH(this.value);drawLayers();"></input>)
  <br>
  Radius: <input type="number" value="${layers[i].getRadius()}""
  onchange="layers[${i}].setRadius(this.value);drawLayers();"></input>
  Draw Outline: <select
  onchange="setLayerSetting(${i}, 'outline', this.value);drawLayers();">
    <option value="true" ${layers[i].getLayerSetting('outline')=='true'?'selected':''}>Yes</option>
    <option value="false" ${layers[i].getLayerSetting('outline')=='true'?'':'selected'}>No</option></select>
  <br>
  Gradient Fill: <select
  onchange="setLayerSetting(${i}, 'dither', this.value);drawLayers();">
    <option value="false" ${layers[i].getLayerSetting('dither')=='false'?'selected':''}>No</option>
    <option value="lr" ${layers[i].getLayerSetting('dither')=='lr'?'selected':''}>&#8646;</option>
    <option value="ud" ${layers[i].getLayerSetting('dither')=='ud'?'selected':''}>&#8645;</option>
    <option value="mix" ${layers[i].getLayerSetting('dither')=='mix'?'selected':''}>&#8281;</option></select>
  Inverter?: <select
  onchange="setLayerSetting(${i}, 'inverter', this.value);drawLayers();">
    <option value="true" ${layers[i].getLayerSetting('inverter')=='true'?'selected':''}>Yes</option>
    <option value="false" ${layers[i].getLayerSetting('inverter')=='true'?'':'selected'}>No</option></select>
  <br>
  Background Color (#RRGGBB[AA]): <input type="text" value="${layers[i].getBgColor()}"
  onchange="this.value=quantizeColor(this.value);layers[${i}].setBgColor(this.value);drawLayers();"></input>
  <br>
  Foreground Color (#RRGGBB[AA]): <input type="text" value="${layers[i].getFgColor()}"
  onchange="this.value=quantizeColor(this.value);layers[${i}].setFgColor(this.value);drawLayers();"></input>
  <br>`
  if(layers[i].getType() == "text"){
    layer_info.innerHTML = layer_info.innerHTML + `
    <hr>
    Text Content: <input type="text" value="${layers[i].getContent()}"
    onchange="layers[${i}].setContent(this.value);drawLayers();"></input>
    <br>
    Text Align: <select
    onchange="setFontSetting(${i}, 'align', this.value);drawLayers();">
      <option value="left" ${layers[i].getFontSetting('align')=='left'?'selected':''}>&#8676;</option>
      <option value="center" ${layers[i].getFontSetting('align')=='center'?'selected':''}>&#8697;</option>
      <option value="right" ${layers[i].getFontSetting('align')=='right'?'selected':''}>&#8677;</option></select>
    Word Wrap: <select
    onchange="setFontSetting(${i}, 'wordWrap', this.value);drawLayers();">
      <option value="true" ${layers[i].getFontSetting('wordWrap')=='true'?'selected':''}>&#8629;</option>
      <option value="false" ${layers[i].getFontSetting('wordWrap')=='false'?'selected':''}>&#8230;</option></select>
    <br>
    Font Style: <select id="font-style"
    onchange="setFontSizeStyle(${i});drawLayers();">
      <option value="sans-serif" ${getFontStyle(i)=='sans-serif'?'selected':''}>Sans-Serif</option>
      <option value="serif" ${getFontStyle(i)=='serif'?'selected':''}>Serif</option>
      <option value="monospace" ${getFontStyle(i)=='monospace'?'selected':''}>Monospace</option></select>
    Font Size: <input type="number" id="font-size" value="${getFontSize(i)}"
    onchange="setFontSizeStyle(${i});drawLayers();"></input>
    `;
  }
  layer_info.innerHTML = layer_info.innerHTML + `
  <hr>
  <button onclick="disableLayer(${i});">
    Delete Layer</button>`;
  for(var child=layer_container.firstChild; child!==null; child=child.nextSibling) {
    let j = child.id;
    if (i == j){
      child.style.backgroundColor = "lightslategray";
      child.style.color = "white";
    } else if (j != 'add_button') {
      child.style.backgroundColor = "rgb(124, 180, 199)";
      child.style.color = "black";
    }
  }
}

function addLayer(){
  for (let i = 0; i<numLayers; i++){
    if (layers[i].getLayerSetting("enabled")=='false'){
      layers[i].setLayerSetting("enabled", 'true');
      layers[i].setName('New Layer '+i);
      layers[i].setY(10+5*i);
      addLayerToList(layers, i);
      reorderListData();
      populateList();
      drawLayers();
      return;
    }
  }
}

function disableLayer(i){
  layers[i].setLayerSetting("enabled", 'false');
  openLayer(-1);
  reorderListData();
  populateList();
  drawLayers();
}

function reorderListData(){
  let new_layers = [];
  for(var child=layer_container.firstChild; child!==null; child=child.nextSibling) {
    let i = parseInt(child.id);
    if (child.id != 'add_button') {
      if (layers[i].getLayerSetting("enabled") == "true"){
        new_layers.push(layers[i]);
      }
    }
  }
  for(let i=new_layers.length; i<numLayers; i++){
    new_layers.push(new Layer());
  }
  layers.splice(0, new_layers.length, ...new_layers);
}

function setFontSizeStyle(i){
  setFontSetting(i, "font", document.getElementById("font-size").value + "px " +
                            document.getElementById("font-style").value);
}
function getFontSize(i){
  return parseInt(layers[i].getFontSetting("font"));
}
function getFontStyle(i){
  return (layers[i].getFontSetting("font")).split(' ')[1];
}

function setLayerSetting(i, key, value){
  layers[i].setLayerSetting(key, value);
}

function setFontSetting(i, key, value){
  layers[i].setFontSetting(key, value);
}

function populateList() {
  layer_container.innerHTML = "";
  for (let i = 0; i<numLayers; i++){
    if (layers[i].getLayerSetting("enabled")=='true'){
      addLayerToList(layers, i);
    }
  }
  addButton = document.createElement("div");
  addButton.classList.add("layer");
  addButton.classList.add("flex");
  addButton.id = 'add_button'
  addButton.style="background:none;"
  addButton.innerHTML = `<div class="flex center square">
    <button class="action" onclick="addLayer();">&#128932;</button></div>
        <div class="flex center">
          Add Layer
        </div>
        <div class="grow"></div>`
  layer_container.appendChild(addButton);
}

function addLayerToList(layers, i){
  listItem = document.createElement("div");
  listItem.classList.add("layer");
  listItem.classList.add("flex");
  listItem.innerHTML = '<div class="flex center square"><button class="handle">&#8645;</button></div>\
  <div class="flex center grow"><button style="width:100%;height:100%;background:none;color:inherit;" onclick="openLayer('+i+');" id="name'+i+'">'+layers[i].getName()+'</button></div>'
  layer_container.appendChild(listItem);
  listItem.id = i;
}

function defaultLayers() {
  for (let i = 0; i<numLayers; i++){
    layer = new Layer();
    layers[i] = layer;
    layers[i].setLayerSetting("enabled", 'false');
  }

  layers[0].setName("Red Circle");
  layers[0].setPos(15,15,40,40);
  layers[0].setRadius(20);
  layers[0].setBgColor("#AA0000");
  layers[0].setFgColor("#00FF00");
  layers[0].setLayerSetting("outline", 'true');
  layers[0].setLayerSetting("enabled", 'true');

  layers[1].setName("Inverter Rectangle")
  layers[1].setPos(25,25,60,20);
  layers[1].setRadius(5);
  layers[1].setBgColor("#00000000");
  layers[1].setLayerSetting("inverter", 'true');
  layers[1].setLayerSetting("enabled", 'true');

  layers[2].setName("Fade to Blue")
  layers[2].setPos(40,20,60,30);
  layers[2].setRadius(10);
  layers[2].setBgColor("#00000000");
  layers[2].setFgColor("#0055FF");
  layers[2].setLayerSetting("dither", "lr");
  layers[2].setLayerSetting("enabled", 'true');
  layers[2].setLayerSetting("outline", 'true');

  layers[3].setName("Hello World Text");
  layers[3].setType("text");
  layers[3].setFontSetting("font", "18px sans-serif");
  layers[3].setFontSetting("align", "left");
  layers[3].setFontSetting("wordWrap", "true");
  layers[3].setPos(20,60,100,50);
  layers[3].setRadius(10);
  layers[3].setBgColor("#000000");
  layers[3].setFgColor("#FFFFFF");
  layers[3].setLayerSetting("enabled", 'true');
  layers[3].setLayerSetting("outline", 'true');
  layers[3].setContent("Hello World a bb ccc dddd eeeee");
}

setInterval(drawLayers, 1000);

function drawLayers() {
  ctx.fillStyle = background_color.value;
  ctx.fillRect(0, 0, plat_w, plat_h);
  for(var child=layer_container.firstChild; child!==null; child=child.nextSibling) {
    let i = parseInt(child.id);
    if (i >= 0 && i < numLayers){
      if (layers[i].getLayerSetting("enabled")=='true'){
        layers[i].draw(ctx);
      }
    }
  }
}

new Sortable(layer_container, {
    handle: '.handle',
    animation: 150,
    ghostClass: 'ghost-class'
});

function quantizeColor(color) {
  r = parseInt(color[1] + color[2], 16);
  g = parseInt(color[3] + color[4], 16);
  b = parseInt(color[5] + color[6], 16);
  a = parseInt(color[7] + color[8], 16);
  r = "05AF"[Math.floor(r / 64)];
  g = "05AF"[Math.floor(g / 64)];
  b = "05AF"[Math.floor(b / 64)];
  if (isNaN(a)){
    return "#" + r + r + g + g + b + b
  }
  a = isNaN(a)||a>=64?'F':'0';
  return "#" + r + r + g + g + b + b + a + a;
}

function sizePreview(scale = 1) {
  preview.width = plat_w;
  preview.height = plat_h;
  preview.style.width = plat_w * scale + "px";
  preview.style.height = plat_h * scale + "px";

  mask.width = plat_w;
  mask.height = plat_h;
  mask.style.width = plat_w * scale + "px";
  mask.style.height = plat_h * scale + "px";

  canvas_container.style.width = plat_w * scale + "px";
  canvas_container.style.height = plat_h * scale + "px";

  layer_container.style.maxHeight = "calc(" + plat_h * scale + "px + 2vh)";

  console.log(layer_container.style.maxHeight);

  if (platform == "chalk" || platform == "gabbro") {
    mask_ctx.rect(0, 0, plat_w, plat_h);
    mask_ctx.fillStyle = "#808080B0";
    mask_ctx.fill();
    mask_ctx.globalCompositeOperation = "destination-out";
    mask_ctx.beginPath();
    mask_ctx.fillStyle = "#FFFFFFFF";
    mask_ctx.arc(plat_w / 2, plat_w / 2, plat_w / 2 + 0.5, 0, 2 * Math.PI);
    mask_ctx.fill();
  } else {
    mask_ctx.rect(0, 0, plat_w, plat_h);
    mask_ctx.fillStyle = "#FFFFFF00";
    mask_ctx.fill();
  }
}

function getQueryParam(variable, defaultValue) {
  var query = location.search.substring(1);
  var vars = query.split("&");
  for (var i = 0; i < vars.length; i++) {
    var pair = vars[i].split("=");
    if (pair[0] === variable) {
      return decodeURIComponent(pair[1]);
    }
  }
  return defaultValue || false;
}

var xhrRequest = function (url, type, callback) {
  var xhr = new XMLHttpRequest();
  xhr.onload = function () {
    callback(this.responseText);
  };
  xhr.open(type, url);
  xhr.send();
};

function getPlatform() {
  // Get the platform from the URL:
  platform = getQueryParam("platform", "none");
  if (platform != "none") {
    platform_element.value = platform;
    platform_element.disabled = true;
  } else {
    platform = platform_element.value;
  }
  switch (platform) {
    case "chalk":
      plat_w = 180;
      plat_h = 180;
      break;
    case "emery":
      plat_w = 200;
      plat_h = 228;
      break;
    case "gabbro":
      plat_w = 260;
      plat_h = 260;
      break;
    case "aplite":
    case "basalt":
    case "diorite":
    case "flint":
    default:
      plat_w = 144;
      plat_h = 168;
      break;
  }
  console.log(platform, plat_w, plat_h);
  sizePreview();
  drawLayers();
}

platform_element.addEventListener("input", getPlatform);
// Add a 'click' listener
submitButton.addEventListener("click", function () {
  // Get the config data from the UI elements
  var background_color = document.getElementById("background_color_input");
  var temperatureCheckbox = document.getElementById("temperature_checkbox");

  // Make a data object to be sent, coercing value types to integers
  var options = {
    background_color: parseInt(background_color.value.substr(1, 6), 16),
    temperature_checkbox: temperatureCheckbox.checked ? 1 : 0,
  };

  console.log(
    parseInt(background_color.value.substr(1, 6), 16),
    temperatureCheckbox.checked ? 1 : 0,
  );

  // Determine the correct return URL (emulator vs real watch)
  var return_to = getQueryParam("return_to", "pebblejs://close#");

  // Encode and send the data when the page closes
  document.location = return_to + encodeURIComponent(JSON.stringify(options));

  //fetch(return_to + encodeURIComponent(JSON.stringify(options)));

  //const iframe = document.createElement("iframe");
  //iframe.src = return_to + encodeURIComponent(JSON.stringify(options));
  //iframe.style.display = "none";
  //document.body.appendChild(iframe);
});

//-------------------------------------
//   Manage changing viewport heights.
//   We-work when testing on Mobile.

// First we get the viewport height and we multiple it by 1% to get a value for a vh unit
let vh = window.innerHeight * 0.01;
// Then we set the value in the --vh custom property to the root of the document
document.documentElement.style.setProperty("--vh", `${vh}px`);

// We listen to the resize event
window.addEventListener("resize", () => {
  // We execute the same script as before
  let vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty("--vh", `${vh}px`);
  //console.log(vh);
});

  </script>
</body>
</html>
