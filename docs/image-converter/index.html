  <script>

function incSib(el, inc, min=0, max=260){
  var element;
  if (inc>0){
    element = el.previousElementSibling;
  } else {
    element = el.nextElementSibling;
  }
  element.value = Math.min(max,Math.max(min,parseInt(element.value) + inc));
  element.dispatchEvent(new Event('input'));
}

function getQueryParam(variable, defaultValue) {
  var query = location.search.substring(1);
  var vars = query.split("&");
  for (var i = 0; i < vars.length; i++) {
    var pair = vars[i].split("=");
    if (pair[0] === variable) {
      return decodeURIComponent(pair[1]);
    }
  }
  return defaultValue || false;
}

function dragCropHandle(elmnt) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

  var old_width, old_height;
  var old_cropW, old_cropH;
  
  elmnt.onpointerdown = dragMouseDown;

  function dragMouseDown(e) {
    e = e || window.event;
    e.preventDefault();
    // get the mouse cursor position at startup:
    pos3 = e.clientX;
    pos4 = e.clientY;
    old_width = input_width.value;
    old_height = input_height.value;
    old_cropW = cropW;
    old_cropH = cropH;
    document.onpointerup = closeDragElement;
    // call a function whenever the cursor moves:
    document.onpointermove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    // calculate the new cursor position:
    pos1 = (pos3 - e.clientX)*image_input.width/image_input.offsetWidth;
    pos2 = (pos4 - e.clientY)*image_input.height/image_input.offsetHeight;
    pos3 = e.clientX;
    pos4 = e.clientY;
    // set the element's new position:
    if (elmnt.classList[1].includes('top')){
      cropY -= pos2;
      if (cropY < 0){
        pos2 += cropY;
        cropY = 0;
      }
      cropH += pos2;
      if (cropH < 0){
        cropY += pos2;
      }
    } else {
      cropH -= pos2;
    }
    if (cropH < 0){
      cropH = 0;
    }
    if (cropY + cropH > img.naturalHeight){
      cropH = img.naturalHeight-cropY;
    }
    if (elmnt.classList[1].includes('left')){
      cropX -= pos1;
      if (cropX < 0){
        pos1 += cropX;
        cropX = 0;
      }
      cropW += pos1;
      if (cropW < 0){
        cropX += pos1;
      }
    } else {
      cropW -= pos1;
    }
    if (cropW < 0){
      cropW = 0;
    }
    if (cropX + cropW > img.naturalWidth){
      cropW = img.naturalWidth-cropX;
    }

    updateOutlinerPosition();

    let new_w = Math.max(1,cropW * old_width/old_cropW);
    //let new_h = Math.max(1,Math.round(cropH * old_height/old_cropH));

    
    input_width.value = Math.round(new_w);
    input_height.value = Math.max(1,Math.round(new_w*cropH/cropW));
    //input_height.value = new_h;
    
    if (crop_timer){
      clearTimeout(crop_timer);
    }
    if (render_timer){
      clearTimeout(render_timer);
    }
    crop_timer = setTimeout(crop_change, 500);

    //updateCropValues();
    //update();

  }

  

  function closeDragElement() {
    /* stop moving when pointer button is released:*/
    document.onpointerup = null;
    document.onpointermove = null;
  }
}

const max_image_dimension = 1080;

var inputData = ctx_in.getImageData(0, 0, image_input.width, image_input.height);

function handleFiles() {
    if ( this.files && this.files[0] ) {
        var FR= new FileReader();
        FR.onload = function(e) {
           
           img.src = e.target.result;
           img.onload = function() {
            var naturalHeight = img.naturalHeight;
            var naturalWidth = img.naturalWidth;
            var maxWidth = Math.min(max_image_dimension,naturalWidth);
            var maxHeight = Math.min(max_image_dimension,naturalHeight);
            console.log(naturalWidth, naturalHeight);
            if (naturalWidth>naturalHeight){
                maxHeight = Math.round(maxWidth*naturalHeight/naturalWidth);
            } else {
                maxWidth = Math.round(maxHeight*naturalWidth/naturalHeight);
            }
            image_input.width = maxWidth;//Math.max(input_width.value, input_height.value);
            image_input.height = maxHeight;
            image_input.style.width = Math.floor(90/Math.max(1,maxHeight/maxWidth))+"%";
            console.log(maxWidth, maxHeight);
            ctx_in.drawImage(img, 0, 0, maxWidth, maxHeight);

            var width = 100;
            var height = 100;

            if (naturalWidth>naturalHeight){
                height = Math.round(height*naturalHeight/naturalWidth);
            } else {
                width = Math.round(width*naturalWidth/naturalHeight);
            }
            input_height.value = height;
            input_width.value = width;


            img.src = image_input.toDataURL();
            img.onload = function() {
                brightness_element.value = 0;
                contrast_element.value = 0;
                saturation_element.value = 0;
                ctx_in.drawImage(img, 0, 0);
                inputData = ctx_in.getImageData(0, 0, image_input.width, image_input.height);
                getDither();
                findColors();
                initCrop();
            }; 

            loaded = true;

           };
        };       
        FR.readAsDataURL( this.files[0] );
        
    }
}

function isLight(color) {
  let r = ((color.charAt(0) == '5') ? 1 : 0) + ((color.charAt(0) == 'a') ? 2 : 0) + ((color.charAt(0) == 'f') ? 3 : 0);
  let g = ((color.charAt(1) == '5') ? 1 : 0) + ((color.charAt(1) == 'a') ? 2 : 0) + ((color.charAt(1) == 'f') ? 3 : 0);
  let b = ((color.charAt(2) == '5') ? 1 : 0) + ((color.charAt(2) == 'a') ? 2 : 0) + ((color.charAt(2) == 'f') ? 3 : 0);


  if ((2*r)+(3*g)+(1*b) >= 9){
    return true;
  } else {
    return false;
  }
}

function indexOfMax(arr) {
    if (arr.length === 0) {
        return -1;
    }

    var max = arr[0];
    var maxIndex = 0;
    for (var i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
            maxIndex = i;
            max = arr[i];
        }
    }
    return maxIndex;
}

function update() {
  if (!loaded){
    return;
  }
  if (render_timer){
    clearTimeout(render_timer);
  }
  let width = input_width.value;
  let height = input_height.value;
  let brightness = parseInt(brightness_element.value);
  let contrast = parseInt(contrast_element.value)/255;
  let saturation = parseInt(saturation_element.value);
  let sat_max = (saturation < 0) ? 255 : 128;
  getDither();
  
  let new_width = input_width.value;
  let new_height = input_height.value;
  if ((new_width != image_output.width) || (new_height != image_output.height)) {
    image_output.width = width;
    image_output.height = height;
    image_output.style.width = Math.floor(90/Math.max(1,height/width))+"%";
  }
  
  //let inputData = ctx_in.getImageData(0, 0, img.naturalWidth, img.naturalHeight);

  const data = inputData.data;
  
  for(let i=0; i<data.length; i+=4){
    data[i] = Math.max(0,Math.min(255,data[i]+brightness)); // red
    data[i + 1] = Math.max(0,Math.min(255,data[i+1]+brightness)); // green
    data[i + 2] = Math.max(0,Math.min(255,data[i+2]+brightness)); // blue
  }
  let avgGray = 0;
  for (let i = 0; i < data.length; i+=4) {
    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];
    avgGray += (r * 0.2126 + g * 0.7152 + b * 0.0722);
  }
  avgGray = avgGray/(data.length/4);
  
  for (let i = 0; i < data.length; i+=4) {
    data[i] = Math.max(0,Math.min(255,data[i]+(data[i]-avgGray)*contrast));
    data[i+1] = Math.max(0,Math.min(255,data[i + 1]+(data[i + 1]-avgGray)*contrast));
    data[i+2] = Math.max(0,Math.min(255,data[i + 2]+(data[i + 2]-avgGray)*contrast));
  }

  for (let i = 0; i < data.length; i+=4) {
      let r = data[i];
      let g = data[i+1];
      let b = data[i+2];
      let gray = (r * 0.2126 + g * 0.7152 + b * 0.0722);
      
      r += (r - gray) * saturation / sat_max;
      g += (g - gray) * saturation / sat_max;
      b += (b - gray) * saturation / sat_max;
      
      if (r > 255) r = 255;
      else if (r < 0) r = 0;
      if (g > 255) g = 255;
      else if (g < 0) g = 0;
      if (b > 255) b = 255;
      else if (b < 0) b = 0;

      data[i] = r;
      data[i+1] = g;
      data[i+2] = b;
  }
  ctx_in.putImageData(inputData, 0, 0);
  createImageBitmap(image_input).then(bitmap => {
    ctx_out.drawImage(bitmap, Math.round(cropX), Math.round(cropY), Math.round(cropW),Math.round(cropH), 0, 0, input_width.value, input_height.value);
    render_timer = setTimeout(render, 500);
  });
}

let checked_colors = [];

function closestColor(color, all=false){
  let min_error = 999999;
  let closest = [0,0,0];
  for (let i = 0; i < colors.length; i++) {
    for (let j = 0; j < colors[i].length; j++) {
      if (colors[i][j][1] == true || all){
        r = parseInt(colors[i][j][0][0] + colors[i][j][0][0], 16);
        g = parseInt(colors[i][j][0][1] + colors[i][j][0][1], 16);
        b = parseInt(colors[i][j][0][2] + colors[i][j][0][2], 16);
        var error;
        if (dither[1] == 'l'){
        error = deltaE([r,g,b],color);
        } else {
        error = Math.abs(r-color[0])+Math.abs(g-color[1])+Math.abs(b-color[2]);
        }
        if (error < min_error){
          min_error = error;
          //closest = [r,g,b];
          closest = [r,g,b,error,colors[i][j]];
        }
      }
    }
  }
  return(closest);
}

function deltaE(rgbA, rgbB) {
  let labA = rgb2lab(rgbA);
  let labB = rgb2lab(rgbB);
  let deltaL = labA[0] - labB[0];
  let deltaA = labA[1] - labB[1];
  let deltaB = labA[2] - labB[2];
  let c1 = Math.sqrt(labA[1] * labA[1] + labA[2] * labA[2]);
  let c2 = Math.sqrt(labB[1] * labB[1] + labB[2] * labB[2]);
  let deltaC = c1 - c2;
  let deltaH = deltaA * deltaA + deltaB * deltaB - deltaC * deltaC;
  deltaH = deltaH < 0 ? 0 : Math.sqrt(deltaH);
  let sc = 1.0 + 0.045 * c1;
  let sh = 1.0 + 0.015 * c1;
  let deltaLKlsl = deltaL / (1.0);
  let deltaCkcsc = deltaC / (sc);
  let deltaHkhsh = deltaH / (sh);
  let i = deltaLKlsl * deltaLKlsl + deltaCkcsc * deltaCkcsc + deltaHkhsh * deltaHkhsh;
  return i < 0 ? 0 : Math.sqrt(i);
}

function rgb2lab(rgb){
  let r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255, x, y, z;
  r = (r > 0.04045) ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
  g = (g > 0.04045) ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
  b = (b > 0.04045) ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
  x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047;
  y = (r * 0.2126 + g * 0.7152 + b * 0.0722) / 1.00000;
  z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
  x = (x > 0.008856) ? Math.pow(x, 1/3) : (7.787 * x) + 16/116;
  y = (y > 0.008856) ? Math.pow(y, 1/3) : (7.787 * y) + 16/116;
  z = (z > 0.008856) ? Math.pow(z, 1/3) : (7.787 * z) + 16/116;
  return [(116 * y) - 16, 500 * (x - y), 200 * (y - z)]
}
